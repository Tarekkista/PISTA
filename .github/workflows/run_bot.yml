name: Crypto Trading Bot 24/7

on:
  schedule:
    # Relancement automatique toutes les 5 heures
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter le bot (Timeout à 5h)
        run: |
          timeout 18000s python -u bot.py || true
